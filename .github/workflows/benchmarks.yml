name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.1"

jobs:
  parsers:
    name: Parser timing and memory
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Measure parser timing
        run: >-
          uv run --locked python -m benchmarks.benchmark_parsers
          --rigorous
          -o benchmark-timing.json

      - name: Measure parser peak RSS
        run: >-
          uv run --locked python -m benchmarks.measure_memory
          --runs 5
          --output benchmark-memory.json

      - name: Upload parser results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parser-benchmarks-${{ github.sha }}
          path: |
            benchmark-memory.json
            benchmark-timing.json
          if-no-files-found: error
          retention-days: 30

  requests:
    name: Django request paths
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Measure Django request paths
        run: >-
          uv run --locked python -m benchmarks.benchmark_requests
          --rigorous
          -o benchmark-requests.json

      - name: Upload request results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: request-benchmarks-${{ github.sha }}
          path: benchmark-requests.json
          if-no-files-found: error
          retention-days: 30

  concurrency:
    name: WSGI concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Measure concurrent WSGI uploads
        run: >-
          uv run --locked python -m benchmarks.measure_concurrency
          --rounds 5
          --requests-per-worker 5
          --output benchmark-concurrency.json

      - name: Upload concurrency results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: concurrency-benchmarks-${{ github.sha }}
          path: benchmark-concurrency.json
          if-no-files-found: error
          retention-days: 30
