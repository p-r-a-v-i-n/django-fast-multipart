name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  MATURIN_VERSION: "v1.15.0"
  UV_VERSION: "0.12.8"

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag and package versions
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          def read_toml(path):
              with open(path, "rb") as file:
                  return tomllib.load(file)

          def locked_package_version(path, package_name):
              packages = read_toml(path)["package"]
              return next(
                  package["version"]
                  for package in packages
                  if package["name"] == package_name
              )

          versions = {
              "pyproject.toml": read_toml("pyproject.toml")["project"]["version"],
              "uv.lock": locked_package_version("uv.lock", "django-fast-multipart"),
              "rust/Cargo.toml": read_toml("rust/Cargo.toml")["package"]["version"],
              "rust/Cargo.lock": locked_package_version(
                  "rust/Cargo.lock", "django-fast-multipart-core"
              ),
          }

          expected_version = versions["pyproject.toml"]
          mismatches = {
              path: version
              for path, version in versions.items()
              if version != expected_version
          }
          if mismatches:
              details = ", ".join(
                  f"{path}={version}" for path, version in versions.items()
              )
              raise SystemExit(f"Release versions do not match: {details}")

          if os.environ["GITHUB_EVENT_NAME"] == "push":
              tag = os.environ["GITHUB_REF_NAME"]
              expected_tag = f"v{expected_version}"
              if tag != expected_tag:
                  raise SystemExit(
                      f"Release tag {tag!r} does not match package version {expected_tag!r}"
                  )
              print(f"Release version {expected_version} matches {tag}")
          else:
              print(f"Release metadata consistently uses version {expected_version}")
          PY

  wheels:
    name: Wheel (${{ matrix.platform.name }})
    needs: validate
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: manylinux x86-64
            runner: ubuntu-24.04
            target: x86_64
            manylinux: "2_17"
            artifact: manylinux-x86_64
          - name: manylinux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_17"
            artifact: manylinux-aarch64
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64
            manylinux: "off"
            artifact: macos-x86_64
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64
            manylinux: "off"
            artifact: macos-aarch64
          - name: Windows x86-64
            runner: windows-2025
            target: x64
            manylinux: "off"
            artifact: windows-x86_64

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: rust/Cargo.lock

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --compatibility pypi --out dist

      - name: Validate wheel on Python 3.12
        run: |
          uv venv --python 3.12 .wheel-venv-312
          uv pip install --python .wheel-venv-312 "Django>=6.1,<6.2"
          uv pip install --python .wheel-venv-312 --no-deps --no-index --find-links dist django-fast-multipart
          uv run --no-project --python .wheel-venv-312 python -I tests/wheel_smoke.py

      - name: Validate wheel on Python 3.14
        run: |
          uv venv --python 3.14 .wheel-venv-314
          uv pip install --python .wheel-venv-314 "Django>=6.1,<6.2"
          uv pip install --python .wheel-venv-314 --no-deps --no-index --find-links dist django-fast-multipart
          uv run --no-project --python .wheel-venv-314 python -I tests/wheel_smoke.py

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheel-${{ matrix.platform.artifact }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          maturin-version: ${{ env.MATURIN_VERSION }}
          args: --manifest-path rust/Cargo.toml --out dist

      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [wheels, sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/django-fast-multipart
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/django-fast-multipart
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
