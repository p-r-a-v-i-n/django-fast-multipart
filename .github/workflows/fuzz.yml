name: Fuzz

on:
  pull_request:
    paths:
      - .github/workflows/fuzz.yml
      - fuzz/**
      - rust/**
  push:
    branches: [main]
    paths:
      - .github/workflows/fuzz.yml
      - fuzz/**
      - rust/**
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CPython retains process-global allocations until interpreter shutdown.
  ASAN_OPTIONS: detect_leaks=0
  CARGO_FUZZ_VERSION: "0.13.2"

jobs:
  multipart-parser:
    name: Multipart parser
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # nightly
        with:
          toolchain: nightly-2026-08-26

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version "${CARGO_FUZZ_VERSION}"

      - name: Build fuzz targets
        run: cargo +nightly-2026-08-26 fuzz build --fuzz-dir fuzz

      - name: Run deterministic pull-request smoke test
        if: github.event_name == 'pull_request'
        run: >-
          cargo +nightly-2026-08-26 fuzz run --fuzz-dir fuzz multipart_parser --
          -dict=fuzz/dictionaries/multipart_parser.dict
          -runs=100
          -seed=1
          -max_len=16384
          -timeout=5

      - name: Run scheduled fuzz test
        if: github.event_name != 'pull_request'
        run: >-
          cargo +nightly-2026-08-26 fuzz run --fuzz-dir fuzz multipart_parser --
          -dict=fuzz/dictionaries/multipart_parser.dict
          -max_total_time=300
          -max_len=16384
          -timeout=5
