[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "django-fast-multipart"
version = "0.1.0a0"
description = "Rust-backed multipart parser for Django"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Pravin" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]
dependencies = [
    "Django>=6.1,<6.2",
]

[project.urls]
Repository = "https://github.com/p-r-a-v-i-n/django-fast-multipart"
Issues = "https://github.com/p-r-a-v-i-n/django-fast-multipart/issues"

[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "maturin>=1.7,<2",
    "pyperf>=2.10",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "django_fast_multipart._core"
bindings = "pyo3"
include = [{ path = "rust/Cargo.lock", format = "sdist" }]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF100"]
